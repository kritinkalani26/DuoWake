; DuoWake - MakeCU 2026
;
; Production envs:  master, slave
; Hardware tests:   test_buzzer, test_ring, test_button
; Module tests:     test_game_reaction, test_game_rotate, test_espnow, test_gemini, test_webui
;
; Build:   pio run -e master
; Flash:   pio run -e master -t upload
; Serial:  pio device monitor -b 115200
; Upload LittleFS (web UI + melodies):  pio run -e master -t uploadfs

[platformio]
default_envs = master
src_dir = src

[common]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv   ; ~1.9 MB app + ~190 KB LittleFS (default 1.3 MB app was 88% full)
lib_ldf_mode = deep+
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -I include
    -I .
lib_deps =
    fastled/FastLED@3.6.0
    bblanchon/ArduinoJson@^7.0.4
    esphome/ESPAsyncWebServer-esphome@^3.2.2
    esphome/AsyncTCP-esphome@^2.1.3

; ---------------------------------------------------------------
; Production
; ---------------------------------------------------------------
[env:master]
extends = common
build_flags = ${common.build_flags} -D ROLE_MASTER=1
build_src_filter = +<main.cpp>

[env:slave]
extends = common
build_flags = ${common.build_flags} -D ROLE_SLAVE=1
build_src_filter = +<main.cpp>

; ---------------------------------------------------------------
; Tests: each env builds exactly one file from /test as its main
; ---------------------------------------------------------------
[env:test_buzzer]
extends = common
build_src_filter = -<*> +<../test/test_buzzer/main.cpp>

[env:test_ring]
extends = common
build_src_filter = -<*> +<../test/test_ring/main.cpp>

[env:test_button]
extends = common
build_src_filter = -<*> +<../test/test_button/main.cpp>

[env:test_game_reaction]
extends = common
build_src_filter = -<*> +<../test/test_game_reaction/main.cpp>

[env:test_game_rotate]
extends = common
build_src_filter = -<*> +<../test/test_game_rotate/main.cpp>

[env:test_espnow]
extends = common
build_flags = ${common.build_flags} -D ROLE_MASTER=1
build_src_filter = -<*> +<../test/test_espnow/main.cpp>

[env:test_gemini]
extends = common
build_flags = ${common.build_flags} -D ROLE_MASTER=1
build_src_filter = -<*> +<../test/test_gemini/main.cpp>

[env:test_webui]
extends = common
build_flags = ${common.build_flags} -D ROLE_MASTER=1
build_src_filter = -<*> +<../test/test_webui/main.cpp>

[env:test_ring_quick]
extends = common
build_src_filter = -<*> +<../test/test_ring_quick/main.cpp>
